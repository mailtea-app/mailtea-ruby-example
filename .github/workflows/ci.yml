name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be re-triggered from the Actions tab without a new commit.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Resolves the Mailtea SDK from its git coordinates and caches it.
          bundler-cache: true
      - run: bundle exec ruby -Itest test/client_test.rb
